<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ระบบบันทึกเข้า-ออก วิทยาลัยฯ</title>

  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #eff6ff,
          #f8fafc
        );

      color: #1e293b;

      min-height: 100vh;

    }


    .container {

      width: 100%;

      max-width: 700px;

      margin: 0 auto;

      padding: 20px;

    }


    .card {

      background: white;

      border-radius: 20px;

      padding: 25px;

      box-shadow:
        0 10px 35px
        rgba(0,0,0,0.10);

    }


    .header {

      text-align: center;

      margin-bottom: 25px;

    }


    .header h1 {

      margin: 0;

      color: #174ea6;

      font-size: 30px;

    }


    .header p {

      margin-top: 8px;

      color: #64748b;

      font-size: 16px;

    }


    /* สถานที่ */

    .location-box {

      margin-bottom: 20px;

    }


    .location-box label {

      display: block;

      font-weight: bold;

      margin-bottom: 8px;

    }


    .location-box select {

      width: 100%;

      height: 50px;

      padding: 0 15px;

      border:
        1px solid
        #cbd5e1;

      border-radius: 10px;

      font-size: 16px;

      background: white;

    }


    /* Scanner */

    .scanner-title {

      text-align: center;

      font-size: 18px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    #reader {

      width: 100%;

      max-width: 500px;

      margin: 0 auto;

      border-radius: 15px;

      overflow: hidden;

    }


    /* ผลลัพธ์ */

    .result {

      display: none;

      margin-top: 20px;

      padding: 20px;

      border-radius: 15px;

      text-align: center;

    }


    .result.success {

      display: block;

      background: #dcfce7;

      color: #166534;

    }


    .result.error {

      display: block;

      background: #fee2e2;

      color: #991b1b;

    }


    .success-icon {

      font-size: 45px;

      margin-bottom: 10px;

    }


    .student-name {

      font-size: 24px;

      font-weight: bold;

      margin: 10px 0;

    }


    .student-id {

      font-size: 17px;

      margin-bottom: 8px;

    }


    .scan-time {

      font-size: 16px;

    }


    /* Loading */

    .loading {

      display: none;

      text-align: center;

      margin-top: 20px;

      color: #475569;

    }


    .spinner {

      width: 35px;

      height: 35px;

      margin: 0 auto 10px;

      border:
        4px solid
        #e2e8f0;

      border-top:
        4px solid
        #2563eb;

      border-radius: 50%;

      animation:
        spin 1s linear infinite;

    }


    @keyframes spin {

      100% {

        transform:
          rotate(360deg);

      }

    }


    /* ปุ่ม */

    .button-box {

      text-align: center;

      margin-top: 20px;

    }


    button {

      border: none;

      border-radius: 10px;

      padding: 13px 25px;

      background: #2563eb;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

    }


    button:hover {

      background: #1d4ed8;

    }


    button:disabled {

      background: #94a3b8;

      cursor: not-allowed;

    }


    .status-text {

      text-align: center;

      margin-top: 15px;

      color: #64748b;

      font-size: 14px;

    }


    /* Mobile */

    @media (max-width: 600px) {

      .container {

        padding: 10px;

      }

      .card {

        padding: 18px;

        border-radius: 15px;

      }

      .header h1 {

        font-size: 24px;

      }

    }

  </style>

</head>


<body>


<div class="container">

  <div class="card">


    <!-- Header -->

    <div class="header">

      <h1>
        ระบบบันทึกเข้า-ออก วิทยาลัยฯ
      </h1>

      <p>
        QR Code Attendance System
      </p>

    </div>


    <!-- สถานที่ -->

    <div class="location-box">

      <label for="location">

        สถานที่

      </label>


      <select id="location">

        <option value="วิทยาลัยฯ">
          วิทยาลัยฯ
        </option>

        <option value="อาคารเรียน">
          อาคารเรียน
        </option>

        <option value="สำนักงาน">
          สำนักงาน
        </option>

        <option value="ห้องประชุม">
          ห้องประชุม
        </option>

      </select>

    </div>


    <!-- Scanner -->

    <div class="scanner-title">

      📷 สแกน QR Code นักศึกษา

    </div>


    <div id="reader"></div>


    <div
      id="statusText"
      class="status-text"
    >

      กำลังเตรียมกล้อง...

    </div>


    <!-- Loading -->

    <div
      id="loading"
      class="loading"
    >

      <div class="spinner"></div>

      <div>
        กำลังบันทึกข้อมูล...
      </div>

    </div>


    <!-- Result -->

    <div
      id="result"
      class="result"
    >

      <div
        id="resultIcon"
        class="success-icon"
      >
        ✓
      </div>


      <div
        id="resultMessage"
      >
      </div>


      <div
        id="studentName"
        class="student-name"
      >
      </div>


      <div
        id="studentId"
        class="student-id"
      >
      </div>


      <div
        id="scanTime"
        class="scan-time"
      >
      </div>

    </div>


    <div class="button-box">

      <button
        id="restartButton"
        onclick="restartScanner()"
        style="display:none;"
      >

        สแกนคนถัดไป

      </button>

    </div>


  </div>

</div>


<script>


/************************************************
 * CONFIG
 ************************************************/


const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyoNi3ZkpARFuV3fKx7_fRfUoBGW8_GbA8VXrmRCWnJ2k-PS_3S-gHx-O_DlV-nMWWK/exec";


const API_KEY =
  "COLLEGE_QR_2026";


let scanner = null;

let scanning = false;

let processing = false;

let lastScannedId = "";

let lastScanTime = 0;


/************************************************
 * เริ่มต้นระบบ
 ************************************************/


window.addEventListener(
  "load",
  function() {

    startScanner();

  }
);


/************************************************
 * เริ่มกล้อง
 ************************************************/


function startScanner() {


  if (scanning) {

    return;

  }


  const reader =
    document.getElementById(
      "reader"
    );


  scanner =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    },

    aspectRatio: 1.0

  };


  scanner
    .start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanError

    )

    .then(
      function() {

        scanning = true;

        document.getElementById(
          "statusText"
        ).innerText =
          "พร้อมสแกน QR Code";

      }
    )

    .catch(
      function(error) {

        console.error(error);

        document.getElementById(
          "statusText"
        ).innerText =
          "ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการใช้กล้อง";

      }
    );

}


/************************************************
 * เมื่อสแกน QR สำเร็จ
 ************************************************/


function onScanSuccess(
  decodedText,
  decodedResult
) {


  if (processing) {

    return;

  }


  const studentId =
    String(decodedText)
      .trim();


  if (!studentId) {

    return;

  }


  /**********************************************
   * ป้องกันการอ่าน QR เดิมซ้ำ
   **********************************************/

  const now =
    Date.now();


  if (
    studentId === lastScannedId &&
    now - lastScanTime < 5000
  ) {

    return;

  }


  lastScannedId =
    studentId;

  lastScanTime =
    now;


  processing = true;


  saveStudent(
    studentId
  );

}


/************************************************
 * QR อ่านไม่สำเร็จ
 ************************************************/


function onScanError(errorMessage) {

  // ไม่ต้องแสดง error ทุก frame
  // เพราะ scanner จะเรียกฟังก์ชันนี้บ่อยมาก

}


/************************************************
 * ส่งข้อมูลไป Apps Script
 ************************************************/


function saveStudent(
  studentId
) {


  const location =
    document
      .getElementById(
        "location"
      )
      .value;


  showLoading(
    true
  );


  /**********************************************
   * JSONP Callback
   **********************************************/

  const callbackName =
    "qrCallback_" +
    Date.now();


  window[callbackName] =
    function(data) {


      try {

        if (
          data.success
        ) {

          showSuccess(
            data
          );

        }

        else {

          showError(
            data.message ||
            "ไม่พบข้อมูลนักศึกษา"
          );

        }

      }

      catch(error) {

        showError(
          error.message
        );

      }


      cleanupJsonp(
        script,
        callbackName
      );

    };


  /**********************************************
   * สร้าง URL
   **********************************************/

  const params =
    new URLSearchParams({

      studentId:
        studentId,

      location:
        location,

      key:
        API_KEY,

      callback:
        callbackName

    });


  const script =
    document.createElement(
      "script"
    );


  script.src =
    SCRIPT_URL +
    "?" +
    params.toString();


  script.onerror =
    function() {

      showLoading(
        false
      );

      showError(
        "ไม่สามารถเชื่อมต่อ Google Apps Script ได้"
      );


      cleanupJsonp(
        script,
        callbackName
      );

    };


  document
    .body
    .appendChild(
      script
    );

}


/************************************************
 * แสดง Loading
 ************************************************/


function showLoading(
  show
) {


  document
    .getElementById(
      "loading"
    )
    .style.display =
      show
        ? "block"
        : "none";

}


/************************************************
 * แสดงผลสำเร็จ
 ************************************************/


function showSuccess(
  data
) {


  showLoading(
    false
  );


  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "result success";


  document
    .getElementById(
      "resultIcon"
    )
    .innerText =
      "✓";


  document
    .getElementById(
      "resultMessage"
    )
    .innerText =
      "บันทึกข้อมูลเรียบร้อย";


  document
    .getElementById(
      "studentName"
    )
    .innerText =
      data.studentName;


  document
    .getElementById(
      "studentId"
    )
    .innerText =
      "Student ID: " +
      data.studentId;


  document
    .getElementById(
      "scanTime"
    )
    .innerText =
      data.date +
      " เวลา " +
      data.time +
      " น. | " +
      data.location;


  document
    .getElementById(
      "restartButton"
    )
    .style.display =
      "inline-block";


  stopScanner();

}


/************************************************
 * แสดง Error
 ************************************************/


function showError(
  message
) {


  showLoading(
    false
  );


  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "result error";


  document
    .getElementById(
      "resultIcon"
    )
    .innerText =
      "!" ;


  document
    .getElementById(
      "resultMessage"
    )
    .innerText =
      message;


  document
    .getElementById(
      "studentName"
    )
    .innerText =
      "";


  document
    .getElementById(
      "studentId"
    )
    .innerText =
      "";


  document
    .getElementById(
      "scanTime"
    )
    .innerText =
      "";


  document
    .getElementById(
      "restartButton"
    )
    .style.display =
      "inline-block";


  stopScanner();

}


/************************************************
 * หยุด Scanner
 ************************************************/


function stopScanner() {


  if (
    scanner &&
    scanning
  ) {

    scanner
      .stop()
      .then(
        function() {

          scanning =
            false;

          document
            .getElementById(
              "statusText"
            )
            .innerText =
              "สแกนเสร็จแล้ว";

        }
      )
      .catch(
        function(error) {

          console.error(error);

          scanning =
            false;

        }
      );

  }

}


/************************************************
 * สแกนคนถัดไป
 ************************************************/


function restartScanner() {


  processing =
    false;


  lastScannedId =
    "";


  document
    .getElementById(
      "result"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "restartButton"
    )
    .style.display =
      "none";


  startScanner();

}


/************************************************
 * ล้าง JSONP
 ************************************************/


function cleanupJsonp(
  script,
  callbackName
) {


  if (script &&
      script.parentNode) {

    script
      .parentNode
      .removeChild(
        script
      );

  }


  try {

    delete window[
      callbackName
    ];

  }

  catch(error) {

    window[
      callbackName
    ] = undefined;

  }


  processing =
    false;

}

</script>

</body>

</html>
