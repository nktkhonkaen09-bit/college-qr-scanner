<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ระบบบันทึกเข้า-ออก วิทยาลัยฯ</title>

  <!-- QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #eff6ff,
          #f8fafc
        );

      color: #1e293b;

      min-height: 100vh;

    }


    .container {

      width: 100%;

      max-width: 700px;

      margin: 0 auto;

      padding: 20px;

    }


    .card {

      background: #ffffff;

      border-radius: 20px;

      padding: 25px;

      box-shadow:
        0 10px 35px
        rgba(0, 0, 0, 0.10);

    }


    /* ========================================
       HEADER
    ======================================== */

    .header {

      text-align: center;

      margin-bottom: 25px;

    }


    .header h1 {

      margin: 0;

      color: #174ea6;

      font-size: 30px;

      line-height: 1.4;

    }


    .header p {

      margin-top: 8px;

      color: #64748b;

      font-size: 16px;

    }


    /* ========================================
       LOCATION
    ======================================== */

    .location-box {

      margin-bottom: 20px;

    }


    .location-box label {

      display: block;

      font-weight: bold;

      margin-bottom: 8px;

    }


    .location-box select {

      width: 100%;

      height: 50px;

      padding: 0 15px;

      border:
        1px solid
        #cbd5e1;

      border-radius: 10px;

      font-size: 16px;

      background: #ffffff;

      color: #1e293b;

      outline: none;

    }


    .location-box select:focus {

      border-color: #2563eb;

    }


    /* ========================================
       SCANNER
    ======================================== */

    .scanner-title {

      text-align: center;

      font-size: 18px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    #reader {

      width: 100%;

      max-width: 500px;

      margin: 0 auto;

      border-radius: 15px;

      overflow: hidden;

    }


    /* ========================================
       STATUS
    ======================================== */

    .status-text {

      text-align: center;

      margin-top: 15px;

      min-height: 25px;

      color: #64748b;

      font-size: 15px;

      font-weight: 500;

    }


    .status-text.ready {

      color: #15803d;

      font-weight: bold;

    }


    .status-text.busy {

      color: #2563eb;

      font-weight: bold;

    }


    .status-text.error {

      color: #dc2626;

      font-weight: bold;

    }


    /* ========================================
       LOADING
    ======================================== */

    .loading {

      display: none;

      text-align: center;

      margin-top: 20px;

      color: #475569;

    }


    .spinner {

      width: 38px;

      height: 38px;

      margin: 0 auto 10px;

      border:
        4px solid
        #e2e8f0;

      border-top:
        4px solid
        #2563eb;

      border-radius: 50%;

      animation:
        spin 1s linear infinite;

    }


    @keyframes spin {

      100% {

        transform:
          rotate(360deg);

      }

    }


    /* ========================================
       RESULT
    ======================================== */

    .result {

      display: none;

      margin-top: 20px;

      padding: 22px;

      border-radius: 18px;

      animation:
        resultIn
        0.3s
        ease;

    }


    @keyframes resultIn {

      from {

        opacity: 0;

        transform:
          translateY(10px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    .result.success {

      background:
        linear-gradient(
          135deg,
          #dcfce7,
          #f0fdf4
        );

      color: #166534;

      border:
        1px solid
        #bbf7d0;

    }


    .result.error {

      background:
        linear-gradient(
          135deg,
          #fee2e2,
          #fff1f2
        );

      color: #991b1b;

      border:
        1px solid
        #fecaca;

    }


    /* ========================================
       RESULT ICON
    ======================================== */

    .result-icon {

      width: 70px;

      height: 70px;

      margin:
        0 auto
        12px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 42px;

      font-weight: bold;

      background: #bbf7d0;

      color: #15803d;

    }


    .result.error .result-icon {

      background: #fecaca;

      color: #dc2626;

    }


    /* ========================================
       RESULT MESSAGE
    ======================================== */

    .result-message {

      text-align: center;

      font-size: 26px;

      font-weight: bold;

      margin-bottom: 8px;

    }


    .result-submessage {

      text-align: center;

      font-size: 17px;

      margin-bottom: 18px;

    }


    /* ========================================
       RECORD DETAILS
    ======================================== */

    .record-box {

      background: rgba(255,255,255,0.75);

      border-radius: 14px;

      padding: 5px 15px;

      margin-top: 15px;

      border:
        1px solid
        rgba(22,101,52,0.12);

    }


    .record-title {

      text-align: center;

      font-size: 18px;

      font-weight: bold;

      padding:
        12px
        0;

      border-bottom:
        1px solid
        rgba(22,101,52,0.12);

    }


    .record-row {

      display: flex;

      align-items: flex-start;

      gap: 10px;

      padding:
        10px
        0;

      border-bottom:
        1px solid
        rgba(0,0,0,0.06);

    }


    .record-row:last-child {

      border-bottom: none;

    }


    .record-icon {

      width: 28px;

      flex-shrink: 0;

      font-size: 18px;

      text-align: center;

    }


    .record-label {

      width: 115px;

      flex-shrink: 0;

      font-weight: bold;

      color: #475569;

    }


    .record-value {

      flex: 1;

      color: #166534;

      font-weight: 600;

      word-break: break-word;

    }


    /* ========================================
       SAVE STATUS
    ======================================== */

    .save-status {

      margin-top: 15px;

      text-align: center;

      padding: 10px;

      border-radius: 10px;

      background: #bbf7d0;

      color: #166534;

      font-weight: bold;

    }


    /* ========================================
       COUNTDOWN
    ======================================== */

    .countdown {

      margin-top: 15px;

      padding-top: 12px;

      border-top:
        1px solid
        rgba(0,0,0,0.10);

      text-align: center;

      font-size: 15px;

      font-weight: bold;

    }


    /* ========================================
       ERROR
    ======================================== */

    .error-message {

      text-align: center;

      margin-top: 15px;

      padding: 15px;

      background: rgba(255,255,255,0.7);

      border-radius: 12px;

      font-weight: bold;

    }


    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 600px) {

      .container {

        padding: 10px;

      }


      .card {

        padding: 18px;

        border-radius: 15px;

      }


      .header h1 {

        font-size: 24px;

      }


      .header p {

        font-size: 14px;

      }


      .scanner-title {

        font-size: 17px;

      }


      .result-message {

        font-size: 23px;

      }


      .record-label {

        width: 95px;

        font-size: 14px;

      }


      .record-value {

        font-size: 14px;

      }

    }

  </style>

</head>


<body>


<div class="container">

  <div class="card">


    <!-- =====================================
         HEADER
    ====================================== -->

    <div class="header">

      <h1>
        ระบบบันทึกเข้า-ออก วิทยาลัยฯ
      </h1>

      <p>
        QR Code Attendance System
      </p>

    </div>


    <!-- =====================================
         LOCATION
    ====================================== -->

    <div class="location-box">

      <label for="location">
        สถานที่
      </label>


      <select id="location">

        <option value="วิทยาลัยฯ">
          วิทยาลัยฯ
        </option>

        <option value="อาคารเรียน">
          อาคารเรียน
        </option>

        <option value="สำนักงาน">
          สำนักงาน
        </option>

        <option value="ห้องประชุม">
          ห้องประชุม
        </option>

      </select>

    </div>


    <!-- =====================================
         SCANNER
    ====================================== -->

    <div class="scanner-title">

      📷 สแกน QR Code นักศึกษา

    </div>


    <div id="reader"></div>


    <div
      id="statusText"
      class="status-text"
    >
      กำลังเตรียมกล้อง...
    </div>


    <!-- =====================================
         LOADING
    ====================================== -->

    <div
      id="loading"
      class="loading"
    >

      <div class="spinner"></div>

      <div>
        กำลังบันทึกข้อมูล กรุณารอสักครู่...
      </div>

    </div>


    <!-- =====================================
         RESULT
    ====================================== -->

    <div
      id="result"
      class="result"
    >

      <div
        id="resultIcon"
        class="result-icon"
      >
        ✓
      </div>


      <div
        id="resultMessage"
        class="result-message"
      >
      </div>


      <div
        id="resultSubmessage"
        class="result-submessage"
      >
      </div>


      <!-- รายละเอียดรายการที่บันทึก -->

      <div
        id="recordBox"
        class="record-box"
      >

        <div class="record-title">

          📋 รายละเอียดรายการที่บันทึก

        </div>


        <!-- ชื่อ -->

        <div class="record-row">

          <div class="record-icon">
            👤
          </div>

          <div class="record-label">
            ชื่อ
          </div>

          <div
            id="recordName"
            class="record-value"
          >
          </div>

        </div>


        <!-- รหัส -->

        <div class="record-row">

          <div class="record-icon">
            🆔
          </div>

          <div class="record-label">
            รหัสนักศึกษา
          </div>

          <div
            id="recordStudentId"
            class="record-value"
          >
          </div>

        </div>


        <!-- สถานที่ -->

        <div class="record-row">

          <div class="record-icon">
            📍
          </div>

          <div class="record-label">
            สถานที่
          </div>

          <div
            id="recordLocation"
            class="record-value"
          >
          </div>

        </div>


        <!-- วันที่ -->

        <div class="record-row">

          <div class="record-icon">
            📅
          </div>

          <div class="record-label">
            วันที่
          </div>

          <div
            id="recordDate"
            class="record-value"
          >
          </div>

        </div>


        <!-- เวลา -->

        <div class="record-row">

          <div class="record-icon">
            🕐
          </div>

          <div class="record-label">
            เวลา
          </div>

          <div
            id="recordTime"
            class="record-value"
          >
          </div>

        </div>


        <!-- รายการ เข้า/ออก -->

        <div class="record-row">

          <div class="record-icon">
            📝
          </div>

          <div class="record-label">
            รายการ
          </div>

          <div
            id="recordAction"
            class="record-value"
          >
          </div>

        </div>


        <!-- สถานะ -->

        <div class="save-status">

          ✓ บันทึกข้อมูลสำเร็จ

        </div>

      </div>


      <!-- Countdown -->

      <div
        id="countdown"
        class="countdown"
      >
      </div>

    </div>


  </div>

</div>


<script>

/************************************************
 * CONFIG
 ************************************************/

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyoNi3ZkpARFuV3fKx7_fRfUoBGW8_GbA8VXrmRCWnJ2k-PS_3S-gHx-O_DlV-nMWWK/exec";


const API_KEY =
  "COLLEGE_QR_2026";


/************************************************
 * SETTINGS
 ************************************************/


/*
 * แสดงรายละเอียดหลังบันทึก
 * 5 วินาที
 */

const DISPLAY_TIME = 5000;


/*
 * ป้องกัน QR เดิมซ้ำ
 */

const DUPLICATE_TIME = 5000;


/*
 * Timeout การเชื่อมต่อ
 */

const REQUEST_TIMEOUT = 15000;


/************************************************
 * VARIABLES
 ************************************************/

let scanner = null;

let scanning = false;

let processing = false;

let lastScannedId = "";

let lastScanTime = 0;

let displayTimer = null;

let countdownTimer = null;

let requestTimer = null;


/************************************************
 * START
 ************************************************/

window.addEventListener(
  "load",
  function () {

    startScanner();

  }
);


/************************************************
 * START CAMERA
 ************************************************/

function startScanner() {


  /*
   * ถ้ากล้องเปิดอยู่แล้ว
   * ไม่ต้องเปิดใหม่
   */

  if (scanning) {

    return;

  }


  /*
   * สร้าง Scanner เพียงครั้งเดียว
   */

  if (!scanner) {

    scanner =
      new Html5Qrcode(
        "reader"
      );

  }


  const config = {

    fps: 10,

    qrbox: {

      width: 250,

      height: 250

    },

    aspectRatio: 1.0

  };


  setStatus(
    "กำลังเปิดกล้อง...",
    ""
  );


  scanner
    .start(

      {
        facingMode:
          "environment"
      },

      config,

      onScanSuccess,

      onScanError

    )

    .then(
      function () {

        scanning = true;

        processing = false;

        setStatus(
          "✓ พร้อมรับการสแกน QR Code",
          "ready"
        );

      }
    )

    .catch(
      function (error) {

        console.error(
          "Camera error:",
          error
        );

        scanning = false;

        setStatus(
          "ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการใช้กล้อง",
          "error"
        );

      }
    );

}


/************************************************
 * QR SUCCESS
 ************************************************/

function onScanSuccess(
  decodedText,
  decodedResult
) {


  /*
   * ถ้ากำลังบันทึกข้อมูล
   * ไม่รับ QR ใหม่
   */

  if (processing) {

    return;

  }


  const studentId =
    String(decodedText)
      .trim();


  if (!studentId) {

    return;

  }


  /*
   * ป้องกัน QR เดิมซ้ำ
   */

  const now =
    Date.now();


  if (

    studentId ===
      lastScannedId &&

    now -
      lastScanTime <
      DUPLICATE_TIME

  ) {

    return;

  }


  lastScannedId =
    studentId;


  lastScanTime =
    now;


  /*
   * ล็อกระบบ
   */

  processing = true;


  setStatus(
    "กำลังตรวจสอบข้อมูลนักศึกษา...",
    "busy"
  );


  saveStudent(
    studentId
  );

}


/************************************************
 * QR ERROR
 ************************************************/

function onScanError(
  errorMessage
) {

  /*
   * ไม่แสดง Error
   *
   * เพราะ Scanner เรียกฟังก์ชันนี้
   * ทุกครั้งที่ยังหา QR ไม่พบ
   */

}


/************************************************
 * SAVE STUDENT
 ************************************************/

function saveStudent(
  studentId
) {


  const location =
    document
      .getElementById(
        "location"
      )
      .value;


  /*
   * แสดง Loading
   */

  showLoading(
    true
  );


  /*
   * สร้าง JSONP Callback
   */

  const callbackName =
    "qrCallback_" +
    Date.now();


  const script =
    document.createElement(
      "script"
    );


  /*
   * Timeout
   */

  requestTimer =
    setTimeout(
      function () {

        showLoading(
          false
        );


        showError(
          "การเชื่อมต่อใช้เวลานานเกินไป กรุณาลองใหม่"
        );


        cleanupJsonp(
          script,
          callbackName
        );

      },
      REQUEST_TIMEOUT
    );


  /*
   * Callback
   */

  window[callbackName] =
    function (data) {


      clearTimeout(
        requestTimer
      );


      try {


        if (

          data &&
          data.success

        ) {

          showSuccess(
            data
          );

        }

        else {

          showError(

            data &&
            data.message

              ? data.message

              : "ไม่พบข้อมูลนักศึกษา"

          );

        }


      }

      catch (error) {

        showError(
          error.message
        );

      }


      cleanupJsonp(
        script,
        callbackName
      );

    };


  /*
   * Parameters
   */

  const params =
    new URLSearchParams({

      studentId:
        studentId,

      location:
        location,

      key:
        API_KEY,

      callback:
        callbackName

    });


  /*
   * URL
   */

  script.src =
    SCRIPT_URL +
    "?" +
    params.toString();


  /*
   * Error
   */

  script.onerror =
    function () {


      clearTimeout(
        requestTimer
      );


      showLoading(
        false
      );


      showError(
        "ไม่สามารถเชื่อมต่อ Google Apps Script ได้"
      );


      cleanupJsonp(
        script,
        callbackName
      );

    };


  document
    .body
    .appendChild(
      script
    );

}


/************************************************
 * SUCCESS
 ************************************************/

function showSuccess(
  data
) {


  showLoading(
    false
  );


  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "result success";


  result.style.display =
    "block";


  /*
   * Icon
   */

  document
    .getElementById(
      "resultIcon"
    )
    .innerText =
      "✓";


  /*
   * ข้อความหลัก
   */

  document
    .getElementById(
      "resultMessage"
    )
    .innerText =
      "บันทึกข้อมูลแล้ว";


  /*
   * ข้อความตอบโต้
   */

  document
    .getElementById(
      "resultSubmessage"
    )
    .innerText =
      "รายละเอียดรายการที่ระบบบันทึก";


  /*
   * =========================================
   * รายละเอียดที่บันทึก
   * =========================================
   */


  /*
   * ชื่อ
   */

  document
    .getElementById(
      "recordName"
    )
    .innerText =
      data.studentName || "-";


  /*
   * รหัสนักศึกษา
   */

  document
    .getElementById(
      "recordStudentId"
    )
    .innerText =
      data.studentId || "-";


  /*
   * สถานที่
   */

  document
    .getElementById(
      "recordLocation"
    )
    .innerText =
      data.location || "-";


  /*
   * วันที่
   */

  document
    .getElementById(
      "recordDate"
    )
    .innerText =
      data.date || "-";


  /*
   * เวลา
   */

  document
    .getElementById(
      "recordTime"
    )
    .innerText =
      data.time
        ? data.time + " น."
        : "-";


  /*
   * รายการ เข้า / ออก
   *
   * รองรับชื่อ field หลายแบบ
   */

  const action =
    data.action ||
    data.type ||
    data.status ||
    data.recordType ||
    "บันทึกเข้า-ออก";


  document
    .getElementById(
      "recordAction"
    )
    .innerText =
      action;


  /*
   * Status
   */

  setStatus(
    "✓ บันทึกข้อมูลสำเร็จ",
    "ready"
  );


  /*
   * เสียง
   */

  speak(
    "บันทึกข้อมูลแล้ว ขอบคุณครับ"
  );


  /*
   * เริ่ม 5 วินาที
   */

  startWaitingPeriod();

}


/************************************************
 * ERROR
 ************************************************/

function showError(
  message
) {


  showLoading(
    false
  );


  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "result error";


  result.style.display =
    "block";


  /*
   * Icon
   */

  document
    .getElementById(
      "resultIcon"
    )
    .innerText =
      "!";


  /*
   * ข้อความ
   */

  document
    .getElementById(
      "resultMessage"
    )
    .innerText =
      "ไม่สามารถบันทึกข้อมูลได้";


  document
    .getElementById(
      "resultSubmessage"
    )
    .innerText =
      "กรุณาตรวจสอบข้อมูลและลองใหม่อีกครั้ง";


  /*
   * ซ่อนรายละเอียดการบันทึก
   */

  document
    .getElementById(
      "recordBox"
    )
    .style.display =
      "none";


  /*
   * Status
   */

  setStatus(
    "เกิดข้อผิดพลาด",
    "error"
  );


  /*
   * แสดงข้อความ Error
   */

  const countdown =
    document.getElementById(
      "countdown"
    );


  countdown.innerText =
    message;


  /*
   * เสียง
   */

  speak(
    "ขออภัย ไม่สามารถบันทึกข้อมูลได้"
  );


  /*
   * รอ 5 วินาที
   */

  startWaitingPeriod();

}


/************************************************
 * WAIT 5 SECONDS
 ************************************************/

function startWaitingPeriod() {


  clearTimeout(
    displayTimer
  );


  clearInterval(
    countdownTimer
  );


  let seconds = 5;


  const countdown =
    document.getElementById(
      "countdown"
    );


  countdown.innerText =
    "ระบบจะพร้อมรับการสแกนคนถัดไปใน " +
    seconds +
    " วินาที";


  /*
   * Countdown
   */

  countdownTimer =
    setInterval(
      function () {


        seconds--;


        if (
          seconds > 0
        ) {

          countdown.innerText =
            "ระบบจะพร้อมรับการสแกนคนถัดไปใน " +
            seconds +
            " วินาที";

        }

      },
      1000
    );


  /*
   * ครบ 5 วินาที
   */

  displayTimer =
    setTimeout(
      function () {


        clearInterval(
          countdownTimer
        );


        /*
         * ซ่อนผลลัพธ์
         */

        document
          .getElementById(
            "result"
          )
          .style.display =
            "none";


        /*
         * แสดง Record Box กลับมา
         * สำหรับการสแกนครั้งถัดไป
         */

        document
          .getElementById(
            "recordBox"
          )
          .style.display =
            "block";


        /*
         * ล้างข้อมูล
         */

        clearResult();


        /*
         * ปลดล็อก
         */

        processing =
          false;


        /*
         * ล้าง QR เดิม
         */

        lastScannedId =
          "";


        lastScanTime =
          0;


        /*
         * กล้องยังเปิดอยู่
         *
         * ไม่ Stop
         * ไม่ Restart
         */

        setStatus(
          "✓ พร้อมรับการสแกน QR Code คนถัดไป",
          "ready"
        );


        /*
         * เสียง
         */

        speak(
          "พร้อมรับการสแกนคนถัดไป"
        );


      },
      DISPLAY_TIME
    );

}

/************************************************
 * LOADING
 ************************************************/

function showLoading(
  show
) {


  document
    .getElementById(
      "loading"
    )
    .style.display =
      show
        ? "block"
        : "none";

}


/************************************************
 * STATUS
 ************************************************/

function setStatus(
  message,
  type
) {


  const status =
    document.getElementById(
      "statusText"
    );


  status.innerText =
    message;


  status.className =
    "status-text";


  if (type) {

    status.classList.add(
      type
    );

  }

}


/************************************************
 * TEXT TO SPEECH
 ************************************************/

function speak(
  message
) {


  if (
    !("speechSynthesis" in window)
  ) {

    return;

  }


  try {


    window
      .speechSynthesis
      .cancel();


    const speech =
      new SpeechSynthesisUtterance(
        message
      );


    speech.lang =
      "th-TH";


    speech.rate =
      0.9;


    speech.volume =
      1;


    speech.pitch =
      1;


    window
      .speechSynthesis
      .speak(
        speech
      );


  }

  catch (error) {

    console.log(
      "Speech error:",
      error
    );

  }

}


/************************************************
 * CLEANUP JSONP
 ************************************************/

function cleanupJsonp(
  script,
  callbackName
) {


  if (
    script &&
    script.parentNode
  ) {

    script
      .parentNode
      .removeChild(
        script
      );

  }


  try {

    delete window[
      callbackName
    ];

  }

  catch (error) {

    window[
      callbackName
    ] =
      undefined;

  }

}
