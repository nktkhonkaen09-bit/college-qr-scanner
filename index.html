<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ระบบบันทึกเข้า-ออก วิทยาลัยฯ</title>

  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #eff6ff,
          #f8fafc
        );

      color: #1e293b;

      min-height: 100vh;

    }


    .container {

      width: 100%;

      max-width: 700px;

      margin: 0 auto;

      padding: 20px;

    }


    .card {

      background: white;

      border-radius: 20px;

      padding: 25px;

      box-shadow:
        0 10px 35px
        rgba(0,0,0,0.10);

    }


    /* ========================================
       HEADER
    ======================================== */

    .header {

      text-align: center;

      margin-bottom: 25px;

    }


    .header h1 {

      margin: 0;

      color: #174ea6;

      font-size: 30px;

    }


    .header p {

      margin-top: 8px;

      color: #64748b;

      font-size: 16px;

    }


    /* ========================================
       LOCATION
    ======================================== */

    .location-box {

      margin-bottom: 20px;

    }


    .location-box label {

      display: block;

      font-weight: bold;

      margin-bottom: 8px;

    }


    .location-box select {

      width: 100%;

      height: 50px;

      padding: 0 15px;

      border:
        1px solid
        #cbd5e1;

      border-radius: 10px;

      font-size: 16px;

      background: white;

      color: #1e293b;

    }


    /* ========================================
       SCANNER
    ======================================== */

    .scanner-title {

      text-align: center;

      font-size: 18px;

      font-weight: bold;

      margin-bottom: 15px;

    }


    #reader {

      width: 100%;

      max-width: 500px;

      margin: 0 auto;

      border-radius: 15px;

      overflow: hidden;

    }


    /* ========================================
       STATUS
    ======================================== */

    .status-text {

      text-align: center;

      margin-top: 15px;

      color: #64748b;

      font-size: 14px;

      min-height: 22px;

    }


    /* ========================================
       LOADING
    ======================================== */

    .loading {

      display: none;

      text-align: center;

      margin-top: 20px;

      color: #475569;

    }


    .spinner {

      width: 35px;

      height: 35px;

      margin: 0 auto 10px;

      border:
        4px solid
        #e2e8f0;

      border-top:
        4px solid
        #2563eb;

      border-radius: 50%;

      animation:
        spin 1s linear infinite;

    }


    @keyframes spin {

      100% {

        transform:
          rotate(360deg);

      }

    }


    /* ========================================
       RESULT
    ======================================== */

    .result {

      display: none;

      margin-top: 20px;

      padding: 20px;

      border-radius: 15px;

      text-align: center;

    }


    .result.success {

      display: block;

      background: #dcfce7;

      color: #166534;

    }


    .result.error {

      display: block;

      background: #fee2e2;

      color: #991b1b;

    }


    .success-icon {

      font-size: 45px;

      line-height: 1;

      margin-bottom: 10px;

    }


    .student-name {

      font-size: 24px;

      font-weight: bold;

      margin: 10px 0;

    }


    .student-id {

      font-size: 17px;

      margin-bottom: 8px;

    }


    .scan-time {

      font-size: 16px;

    }


    /* ========================================
       COUNTDOWN
    ======================================== */

    .countdown {

      margin-top: 12px;

      font-size: 14px;

      color: #166534;

      font-weight: bold;

    }


    .result.error .countdown {

      color: #991b1b;

    }


    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 600px) {

      .container {

        padding: 10px;

      }

      .card {

        padding: 18px;

        border-radius: 15px;

      }

      .header h1 {

        font-size: 24px;

      }

      .header p {

        font-size: 14px;

      }

      .student-name {

        font-size: 21px;

      }

      .student-id {

        font-size: 16px;

      }

      .scan-time {

        font-size: 14px;

      }

    }

  </style>

</head>


<body>


<div class="container">

  <div class="card">


    <!-- ======================================
         HEADER
    ======================================= -->

    <div class="header">

      <h1>
        ระบบบันทึกเข้า-ออก วิทยาลัยฯ
      </h1>

      <p>
        QR Code Attendance System
      </p>

    </div>


    <!-- ======================================
         LOCATION
    ======================================= -->

    <div class="location-box">

      <label for="location">

        สถานที่

      </label>


      <select id="location">

        <option value="วิทยาลัยฯ">
          วิทยาลัยฯ
        </option>

        <option value="อาคารเรียน">
          อาคารเรียน
        </option>

        <option value="สำนักงาน">
          สำนักงาน
        </option>

        <option value="ห้องประชุม">
          ห้องประชุม
        </option>

      </select>

    </div>


    <!-- ======================================
         SCANNER
    ======================================= -->

    <div class="scanner-title">

      📷 สแกน QR Code นักศึกษา

    </div>


    <div id="reader"></div>


    <div
      id="statusText"
      class="status-text"
    >

      กำลังเตรียมกล้อง...

    </div>


    <!-- ======================================
         LOADING
    ======================================= -->

    <div
      id="loading"
      class="loading"
    >

      <div class="spinner"></div>

      <div>
        กำลังบันทึกข้อมูล...
      </div>

    </div>


    <!-- ======================================
         RESULT
    ======================================= -->

    <div
      id="result"
      class="result"
    >

      <div
        id="resultIcon"
        class="success-icon"
      >
        ✓
      </div>


      <div
        id="resultMessage"
      >
      </div>


      <div
        id="studentName"
        class="student-name"
      >
      </div>


      <div
        id="studentId"
        class="student-id"
      >
      </div>


      <div
        id="scanTime"
        class="scan-time"
      >
      </div>


      <div
        id="countdown"
        class="countdown"
      >
      </div>

    </div>


  </div>

</div>


<script>


/************************************************
 * CONFIG
 ************************************************/


const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyoNi3ZkpARFuV3fKx7_fRfUoBGW8_GbA8VXrmRCWnJ2k-PS_3S-gHx-O_DlV-nMWWK/exec";


const API_KEY =
  "COLLEGE_QR_2026";


/************************************************
 * SYSTEM VARIABLES
 ************************************************/


let scanner = null;

let scanning = false;

let processing = false;

let lastScannedId = "";

let lastScanTime = 0;

let resultTimer = null;

let jsonpTimeout = null;


/************************************************
 * SETTINGS
 ************************************************/


// เวลาที่แสดงผลหลังบันทึก
const WAIT_TIME = 3000;

// เวลากัน QR เดิมซ้ำ
const DUPLICATE_TIME = 5000;

// Timeout การเชื่อมต่อ Apps Script
const REQUEST_TIMEOUT = 15000;


/************************************************
 * START SYSTEM
 ************************************************/


window.addEventListener(
  "load",
  function() {

    startScanner();

  }
);


/************************************************
 * START SCANNER
 ************************************************/


function startScanner() {


  // ถ้ากล้องกำลังทำงานอยู่
  // ไม่ต้องเปิดซ้ำ

  if (scanning) {

    return;

  }


  const reader =
    document.getElementById(
      "reader"
    );


  /*
   * ถ้า Scanner ยังไม่มี
   * ให้สร้างเพียงครั้งเดียว
   */

  if (!scanner) {

    scanner =
      new Html5Qrcode(
        "reader"
      );

  }


  const config = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    },

    aspectRatio: 1.0

  };


  document.getElementById(
    "statusText"
  ).innerText =
    "กำลังเปิดกล้อง...";


  scanner
    .start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanError

    )

    .then(
      function() {

        scanning = true;

        processing = false;

        document.getElementById(
          "statusText"
        ).innerText =
          "พร้อมสแกน QR Code";

      }
    )

    .catch(
      function(error) {

        console.error(
          "Camera error:",
          error
        );

        scanning = false;

        document.getElementById(
          "statusText"
        ).innerText =
          "ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการใช้กล้อง";

      }
    );

}


/************************************************
 * QR SCAN SUCCESS
 ************************************************/


function onScanSuccess(
  decodedText,
  decodedResult
) {


  /*
   * ถ้ากำลังประมวลผล
   * ไม่รับ QR ใหม่
   */

  if (processing) {

    return;

  }


  const studentId =
    String(decodedText)
      .trim();


  /*
   * QR ว่าง
   */

  if (!studentId) {

    return;

  }


  /*
   * ป้องกัน QR เดิมถูกอ่านซ้ำ
   */

  const now =
    Date.now();


  if (
    studentId === lastScannedId &&
    now - lastScanTime < DUPLICATE_TIME
  ) {

    return;

  }


  lastScannedId =
    studentId;


  lastScanTime =
    now;


  /*
   * ล็อกระบบ
   */

  processing = true;


  /*
   * บันทึกข้อมูล
   */

  saveStudent(
    studentId
  );

}


/************************************************
 * QR SCAN ERROR
 ************************************************/


function onScanError(
  errorMessage
) {

  /*
   * ไม่แสดง Error
   * เพราะฟังก์ชันนี้ทำงานหลายครั้งต่อวินาที
   */

}


/************************************************
 * SAVE STUDENT
 ************************************************/


function saveStudent(
  studentId
) {


  const location =
    document
      .getElementById(
        "location"
      )
      .value;


  /*
   * แสดง Loading
   */

  showLoading(
    true
  );


  /*
   * สร้าง JSONP callback
   */

  const callbackName =
    "qrCallback_" +
    Date.now();


  /*
   * สร้าง script
   */

  const script =
    document.createElement(
      "script"
    );


  /*
   * Timeout
   */

  jsonpTimeout =
    setTimeout(
      function() {

        showLoading(
          false
        );

        showError(
          "การเชื่อมต่อใช้เวลานานเกินไป กรุณาลองใหม่"
        );

        cleanupJsonp(
          script,
          callbackName
        );

      },
      REQUEST_TIMEOUT
    );


  /*
   * Callback
   */

  window[callbackName] =
    function(data) {


      clearTimeout(
        jsonpTimeout
      );


      try {


        if (
          data &&
          data.success
        ) {

          showSuccess(
            data
          );

        }

        else {

          showError(
            data &&
            data.message
              ? data.message
              : "ไม่พบข้อมูลนักศึกษา"
          );

        }


      }

      catch(error) {

        showError(
          error.message
        );

      }


      cleanupJsonp(
        script,
        callbackName
      );

    };


  /*
   * Parameters
   */

  const params =
    new URLSearchParams({

      studentId:
        studentId,

      location:
        location,

      key:
        API_KEY,

      callback:
        callbackName

    });


  /*
   * URL
   */

  script.src =
    SCRIPT_URL +
    "?" +
    params.toString();


  /*
   * Network Error
   */

  script.onerror =
    function() {


      clearTimeout(
        jsonpTimeout
      );


      showLoading(
        false
      );


      showError(
        "ไม่สามารถเชื่อมต่อ Google Apps Script ได้"
      );


      cleanupJsonp(
        script,
        callbackName
      );

    };


  /*
   * ส่ง Request
   */

  document
    .body
    .appendChild(
      script
    );

}


/************************************************
 * SHOW LOADING
 ************************************************/


function showLoading(
  show
) {


  document
    .getElementById(
      "loading"
    )
    .style.display =
      show
        ? "block"
        : "none";

}


/************************************************
 * SHOW SUCCESS
 ************************************************/


function showSuccess(
  data
) {


  /*
   * ปิด Loading
   */

  showLoading(
    false
  );


  /*
   * แสดง Result
   */

  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "result success";


  result.style.display =
    "block";


  /*
   * Icon
   */

  document
    .getElementById(
      "resultIcon"
    )
    .innerText =
      "✓";


  /*
   * Message
   */

  document
    .getElementById(
      "resultMessage"
    )
    .innerText =
      "บันทึกข้อมูลแล้ว";


  /*
   * Student Name
   */

  document
    .getElementById(
      "studentName"
    )
    .innerText =
      data.studentName || "";


  /*
   * Student ID
   */

  document
    .getElementById(
      "studentId"
    )
    .innerText =
      "Student ID: " +
      (data.studentId || "");


  /*
   * Date / Time / Location
   */

  document
    .getElementById(
      "scanTime"
    )
    .innerText =
      (data.date || "") +
      " เวลา " +
      (data.time || "") +
      " น. | " +
      (data.location || "");


  /*
   * Countdown
   */

  startCountdown(
    WAIT_TIME,
    function() {

      restartScanner();

    }
  );

}


/************************************************
 * SHOW ERROR
 ************************************************/


function showError(
  message
) {


  /*
   * ปิด Loading
   */

  showLoading(
    false
  );


  /*
   * แสดง Result
   */

  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "result error";


  result.style.display =
    "block";


  /*
   * Icon
   */

  document
    .getElementById(
      "resultIcon"
    )
    .innerText =
      "!";


  /*
   * Message
   */

  document
    .getElementById(
      "resultMessage"
    )
    .innerText =
      message;


  /*
   * ล้างข้อมูลนักศึกษา
   */

  document
    .getElementById(
      "studentName"
    )
    .innerText =
      "";


  document
    .getElementById(
      "studentId"
    )
    .innerText =
      "";


  document
    .getElementById(
      "scanTime"
    )
    .innerText =
      "";


  /*
   * Countdown
   */

  startCountdown(
    WAIT_TIME,
    function() {

      restartScanner();

    }
  );

}


/************************************************
 * COUNTDOWN
 ************************************************/


function startCountdown(
  milliseconds,
  callback
) {


  /*
   * ยกเลิก Timer เดิม
   */

  clearTimeout(
    resultTimer
  );


  let seconds =
    Math.ceil(
      milliseconds / 1000
    );


  const countdown =
    document.getElementById(
      "countdown"
    );


  countdown.innerText =
    "กำลังเตรียมสแกนคนถัดไปใน " +
    seconds +
    " วินาที";


  /*
   * Countdown ทุก 1 วินาที
   */

  const interval =
    setInterval(
      function() {

        seconds--;

        if (
          seconds > 0
        ) {

          countdown.innerText =
            "กำลังเตรียมสแกนคนถัดไปใน " +
            seconds +
            " วินาที";

        }

      },
      1000
    );


  /*
   * ครบเวลา
   */

  resultTimer =
    setTimeout(
      function() {

        clearInterval(
          interval
        );

        countdown.innerText =
          "";

        callback();

      },
      milliseconds
    );

}


/************************************************
 * STOP SCANNER
 ************************************************/


async function stopScanner() {


  if (
    !scanner ||
    !scanning
  ) {

    scanning = false;

    return;

  }


  try {

    await scanner.stop();

  }

  catch(error) {

    console.error(
      "Scanner stop error:",
      error
    );

  }


  scanning =
    false;


  document
    .getElementById(
      "statusText"
    )
    .innerText =
      "กำลังเตรียมสแกนคนถัดไป...";

}


/************************************************
 * RESTART SCANNER
 ************************************************/


async function restartScanner() {


  /*
   * ยกเลิก Timer เดิม
   */

  clearTimeout(
    resultTimer
  );


  /*
   * ล้างสถานะ
   */

  processing =
    false;


  lastScannedId =
    "";


  lastScanTime =
    0;


  /*
   * ซ่อนผลลัพธ์
   */

  document
    .getElementById(
      "result"
    )
    .style.display =
      "none";


  /*
   * ปิด Loading
   */

  showLoading(
    false
  );


  /*
   * ถ้ากล้องยังเปิดอยู่
   * ให้หยุดก่อน
   */

  if (
    scanner &&
    scanning
  ) {

    await stopScanner();

  }


  /*
   * เปิดกล้องใหม่
   */

  startScanner();

}


/************************************************
 * CLEANUP JSONP
 ************************************************/


function cleanupJsonp(
  script,
  callbackName
) {


  /*
   * ลบ Script
   */

  if (
    script &&
    script.parentNode
  ) {

    script
      .parentNode
      .removeChild(
        script
      );

  }


  /*
   * ลบ Callback
   */

  try {

    delete window[
      callbackName
    ];

  }

  catch(error) {

    window[
      callbackName
    ] =
      undefined;

  }


  /*
   * ไม่ปลดล็อก processing
   * จนกว่าจะจบขั้นตอนแสดงผล
   *
   * showSuccess/showError
   * จะจัดการขั้นตอนต่อไป
   */

}

</script>

</body>

</html>
